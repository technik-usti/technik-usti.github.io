<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,800&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./favicon.png">
</head>
<body data-page="contact">
<header class="site-header"><nav class="nav" data-i18n-attr="aria-label:a11y.mainNav"><a class="brand" href="./index.html"><span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span> <span data-i18n="meta.brand"></span></a></nav></header>
<main class="contact-page">
  <section>
    <p class="eyebrow" data-i18n="contact.eyebrow"></p>
    <h1 data-i18n="contact.title"></h1>
    <p class="lead" data-i18n="contact.lead"></p>
    <div class="contact-methods">
      <a class="contact-method" data-i18n-attr="href:contact.phoneHref">
        <span class="contact-method-title"><span class="contact-method-icon contact-method-icon-img" aria-hidden="true"><img src="./img/phone.svg" alt="" loading="lazy"></span><span data-i18n="contact.phoneLabel"></span></span>
        <span class="contact-method-value" data-i18n="contact.phoneValue"></span>
      </a>
      <a class="contact-method" data-i18n-attr="href:contact.emailHref">
        <span class="contact-method-title"><span class="contact-method-icon contact-method-icon-img" aria-hidden="true"><img src="./img/email.svg" alt="" loading="lazy"></span><span data-i18n="contact.emailLabel"></span></span>
        <span class="contact-method-value" data-i18n="contact.emailValue"></span>
      </a>
      <a class="contact-method" data-i18n-attr="href:contact.viberHref">
        <span class="contact-method-title"><span class="contact-method-icon contact-method-icon-img" aria-hidden="true"><img src="./img/viber.svg" alt="" loading="lazy"></span><span data-i18n="contact.viberLabel"></span></span>
        <span class="contact-method-value" data-i18n="contact.viberValue"></span>
      </a>
      <a class="contact-method" data-i18n-attr="href:contact.messengerHref" target="_blank" rel="noopener">
        <span class="contact-method-title"><span class="contact-method-icon contact-method-icon-img" aria-hidden="true"><img src="./img/whatsapp.svg" alt="" loading="lazy"></span><span data-i18n="contact.messengerLabel"></span></span>
        <span class="contact-method-value" data-i18n="contact.messengerValue"></span>
      </a>
      <a class="contact-method" data-i18n-attr="href:contact.facebookMessengerHref" target="_blank" rel="noopener">
        <span class="contact-method-title"><span class="contact-method-icon contact-method-icon-img" aria-hidden="true"><img src="./img/facebook-messenger.svg" alt="" loading="lazy"></span><span data-i18n="contact.facebookMessengerLabel"></span></span>
        <span class="contact-method-value" data-i18n="contact.facebookMessengerValue"></span>
      </a>
      <a class="contact-method" data-i18n-attr="href:contact.telegramHref" target="_blank" rel="noopener">
        <span class="contact-method-title"><span class="contact-method-icon contact-method-icon-img" aria-hidden="true"><img src="./img/telegram.svg" alt="" loading="lazy"></span><span data-i18n="contact.telegramLabel"></span></span>
        <span class="contact-method-value" data-i18n="contact.telegramValue"></span>
      </a>
    </div>
  </section>
  <div class="hero-card"><img src="./img/master01.png" data-i18n-attr="alt:images.heroMain" loading="eager"></div>
</main>
<script src="./i18n.js"></script><script src="./app.js"></script>
</body>
</html>
